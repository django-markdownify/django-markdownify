[project]
name = "django-markdownify"
dynamic = ["version"]
authors = [
	{ name="Erwin Matijsen", email="erwin@erwinmatijsen.nl" },
	{ name="Ruurd Moelker" },
]
license = "MIT"
description = "Markdown template filter for Django."
readme = "README.md"
requires-python=">=3.7"
dependencies = [
	"Django",
	"markdown",
	"justhtml >= 3.11.3",
]
classifiers=[
	"Environment :: Web Environment",
	"Framework :: Django",
	"Intended Audience :: Developers",
	"Operating System :: OS Independent",
]

[project.urls]
homepage = "https://github.com/erwinmatijsen/django-markdownify"
download = "https://github.com/erwinmatijsen/django-markdownify/archive/0.9.7.tar.gz"

[build-system]
requires = ["setuptools>=80", "setuptools-scm[simple]>=9.2"]
build-backend = "setuptools.build_meta"

[tool.pytest]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = ["."]
